<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Booking</title>
    <script>
        let rideId = null;

        async function checkAuth() {
            const response = await fetch("/check_auth/");
            const data = await response.json();
            if (!data.authenticated) {
                window.location.href = "login.html"; 
            } else {
                document.getElementById("username").innerText = `Welcome, ${data.username}!`;
            }
        }

        async function requestRide() {
            const pickupLat = document.getElementById("pickupLat").value;
            const pickupLng = document.getElementById("pickupLng").value;
            const dropLat = document.getElementById("dropLat").value;
            const dropLng = document.getElementById("dropLng").value;

            const response = await fetch("/ride/request/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    pickup_latitude: pickupLat,
                    pickup_longitude: pickupLng,
                    drop_latitude: dropLat,
                    drop_longitude: dropLng
                }),
            });

            const data = await response.json();
            rideId = data.ride_id;
            document.getElementById("rideStatus").innerText = `Ride Status: ${data.status}`;
            document.getElementById("findDriverBtn").style.display = "block";
        }

        async function findNearestDriver() {
            if (!rideId) {
                alert("No ride requested yet!");
                return;
            }

            const response = await fetch("/ride/find_driver/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ride_id: rideId }),
            });

            const data = await response.json();
            if (data.error) {
                alert(data.error);
            } else {
                document.getElementById("rideStatus").innerText = `Driver Found! Status: ${data.status}`;
            }
        }

        function logout() {
            fetch("/logout/", { method: "POST" }).then(() => {
                window.location.href = "login.html";
            });
        }

        window.onload = checkAuth;
    </script>
</head>
<body>
    <h2>Ride Booking</h2>
    <p id="username">Welcome!</p>
    <button onclick="logout()">Logout</button>
    <hr>

    <h3>Request a Ride</h3>
    <label>Pickup Latitude:</label>
    <input type="text" id="pickupLat"><br>
    <label>Pickup Longitude:</label>
    <input type="text" id="pickupLng"><br>
    <label>Drop Latitude:</label>
    <input type="text" id="dropLat"><br>
    <label>Drop Longitude:</label>
    <input type="text" id="dropLng"><br>
    <button onclick="requestRide()">Request Ride</button>
    <p id="rideStatus">Ride Status: Not Requested</p>

    <button id="findDriverBtn" onclick="findNearestDriver()" style="display: none;">Find Driver</button>
</body>
</html>
